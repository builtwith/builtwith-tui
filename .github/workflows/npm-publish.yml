name: Stage on npm

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag to stage
        required: true
        type: string
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Check token is set
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "ERROR: NPM_TOKEN secret is empty or not set"
            exit 1
          else
            echo "NPM_TOKEN is set (length: ${#NPM_TOKEN})"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}

      - run: npx --yes npm@11.15.0 stage publish --access public
